<div class="dropdown-field">
  @if (label()) {
    <span class="label">{{ label() }}</span>
  }

  <button
    type="button"
    class="trigger focus-ring"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    role="combobox"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [disabled]="disabled()"
    [class.invalid]="!!errorMessage()"
    (click)="toggle()"
  >
    <span class="value" [class.placeholder]="!selectedLabel()">{{ triggerLabel() }}</span>
    <app-icon name="chevron-down" [size]="13" class="chev" [class.open]="open()" />
  </button>

  @if (errorMessage()) {
    <span class="error">{{ errorMessage() }}</span>
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="[
    { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 4 },
    { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -4 }
  ]"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="dropdown-panel">
    <div class="search-row">
      <input
        type="text"
        [placeholder]="searchPlaceholder()"
        [value]="query()"
        (input)="onQueryInput($event)"
        (keydown)="onListKeydown($event)"
      />
      @if (loading()) {
        <span class="spinner"></span>
      }
    </div>

    <div class="options" role="listbox">
      @if (!loading() && !options().length) {
        <div class="empty">No results</div>
      }
      @for (option of options(); track option.label; let i = $index) {
        <div
          class="option"
          role="option"
          [attr.aria-selected]="selectedLabel() === option.label"
          [attr.aria-disabled]="option.disabled || null"
          [class.active]="activeIndex() === i"
          [class.disabled]="option.disabled"
          (mouseenter)="activeIndex.set(i)"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </div>
      }
    </div>
  </div>
</ng-template>
