<div class="field">
  @if (label()) {
    <label class="lbl" [for]="uid">{{ label() }}</label>
  }
  <div class="control-frame" [class.invalid]="!!errorMessage()" [class.disabled]="disabled()">
    <input
      [id]="uid"
      [type]="visible() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [value]="value() ?? ''"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      (input)="onInput($event)"
      (blur)="markTouched()"
    />
    <button
      type="button"
      class="toggle focus-ring"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      (click)="toggleVisibility()"
    >
      <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="16" />
    </button>
  </div>
  @if (errorMessage()) {
    <span class="error">{{ errorMessage() }}</span>
  }
</div>
