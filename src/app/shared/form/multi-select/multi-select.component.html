<div class="ms-field">
  @if (label()) {
    <span class="label">{{ label() }}</span>
  }

  <button
    type="button"
    class="trigger focus-ring"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [disabled]="disabled()"
    [class.invalid]="!!errorMessage()"
    (click)="toggle()"
  >
    @if (selectedOptions().length) {
      <span class="chips">
        @for (opt of selectedOptions(); track opt.label) {
          <span class="chip">
            {{ opt.label }}
            <span class="chip-remove" (click)="removeChip(opt, $event)">
              <app-icon name="close" [size]="11" />
            </span>
          </span>
        }
      </span>
    } @else {
      <span class="value placeholder">{{ placeholder() }}</span>
    }
    <app-icon name="chevron-down" [size]="13" class="chev" [class.open]="open()" />
  </button>

  @if (errorMessage()) {
    <span class="error">{{ errorMessage() }}</span>
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="[
    { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 4 },
    { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -4 }
  ]"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="dropdown-panel" role="listbox" aria-multiselectable="true">
    @for (option of options(); track option.label) {
      <div
        class="option"
        role="option"
        [attr.aria-selected]="isSelected(option)"
        [attr.aria-disabled]="option.disabled || null"
        [class.selected]="isSelected(option)"
        [class.disabled]="option.disabled"
        (click)="toggleOption(option)"
      >
        <span class="check-box" [class.checked]="isSelected(option)">
          @if (isSelected(option)) {
            <app-icon name="check" [size]="11" />
          }
        </span>
        <span>{{ option.label }}</span>
      </div>
    } @empty {
      <div class="option disabled">No options</div>
    }
  </div>
</ng-template>
